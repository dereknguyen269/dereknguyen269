<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Derek Nguyen Builder Console</title>
  <desc id="desc">A dark command console banner for Derek Nguyen, software engineer and product builder currently building Toolover.</desc>
  <rect width="1200" height="420" rx="28" fill="#08111F"/>
  <rect x="1" y="1" width="1198" height="418" rx="27" stroke="#1F6FEB" stroke-opacity="0.75" stroke-width="2"/>
  <path d="M0 92H1200" stroke="#1F2937" stroke-width="2"/>
  <circle cx="45" cy="46" r="8" fill="#F87171"/>
  <circle cx="72" cy="46" r="8" fill="#FBBF24"/>
  <circle cx="99" cy="46" r="8" fill="#34D399"/>
  <text x="132" y="52" fill="#7DD3FC" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700">TOOLOVER.WORK / BUILDER CONSOLE</text>
  <text x="976" y="52" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">HCMC UTC+7</text>
  <text x="56" y="150" fill="#E6EDF3" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="46" font-weight="800">Derek builds small tools</text>
  <text x="56" y="204" fill="#E6EDF3" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="46" font-weight="800">that remove developer friction.</text>
  <text x="58" y="254" fill="#A5B4FC" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="23">Browser-first utilities, backend systems, and useful internet products.</text>
  <rect x="754" y="132" width="390" height="202" rx="18" fill="#0F172A"/>
  <rect x="755" y="133" width="388" height="200" rx="17" stroke="#334155" stroke-width="2"/>
  <text x="784" y="174" fill="#22C55E" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20">$ now</text>
  <text x="784" y="204" fill="#CBD5E1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20">building toolover.work</text>
  <text x="784" y="244" fill="#22C55E" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20">$ stack</text>
  <text x="784" y="274" fill="#CBD5E1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20">ruby go node react</text>
  <text x="784" y="314" fill="#22C55E" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20">$ mode</text>
  <text x="877" y="314" fill="#CBD5E1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20">ship small, useful, public</text>
  <rect x="56" y="324" width="78" height="34" rx="9" fill="#1E293B" stroke="#334155"/>
  <text x="82" y="347" fill="#E2E8F0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">JSON</text>
  <rect x="148" y="324" width="78" height="34" rx="9" fill="#1E293B" stroke="#334155"/>
  <text x="178" y="347" fill="#E2E8F0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">Code</text>
  <rect x="240" y="324" width="66" height="34" rx="9" fill="#1E293B" stroke="#334155"/>
  <text x="263" y="347" fill="#E2E8F0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">API</text>
  <rect x="320" y="324" width="120" height="34" rx="9" fill="#1E293B" stroke="#334155"/>
  <text x="346" y="347" fill="#E2E8F0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">Text tools</text>
